<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DRT Maintain — {% block title %}{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3/dist/htmx.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy:  { DEFAULT: '#1a2744', 50: '#f0f3fa', 100: '#d6ddf0', 700: '#243660', 800: '#1a2744', 900: '#111c36' },
            amber: { DEFAULT: '#f97316' }
          },
          fontFamily: { sans: ['Inter','system-ui','sans-serif'] }
        }
      }
    }
  </script>
  <style>
    [x-cloak] { display: none; }
    .htmx-indicator { opacity: 0; transition: opacity 0.2s; }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }
    .nav-link { @apply flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:bg-white/10 hover:text-white transition-all; }
    .nav-active { @apply bg-orange-500 text-white shadow-lg shadow-orange-500/30 hover:bg-orange-500; }
    .stat-card { @apply bg-white rounded-2xl border border-slate-100 shadow-sm p-5; }
    .btn-primary { @apply inline-flex items-center gap-2 px-4 py-2 bg-orange-500 text-white text-sm font-semibold rounded-xl shadow hover:shadow-md hover:bg-orange-600 transition-all; }
    .btn-ghost { @apply inline-flex items-center gap-2 px-3 py-1.5 text-sm font-medium text-slate-600 border border-slate-200 rounded-lg hover:bg-slate-50 transition-all; }
    .badge-active { @apply px-2 py-0.5 text-[10px] font-bold uppercase rounded bg-green-100 text-green-700; }
    .badge-maint  { @apply px-2 py-0.5 text-[10px] font-bold uppercase rounded bg-orange-100 text-orange-700; }
    .badge-inactive { @apply px-2 py-0.5 text-[10px] font-bold uppercase rounded bg-slate-100 text-slate-500; }
    .badge-overdue   { @apply px-2 py-0.5 text-[10px] font-bold uppercase rounded bg-red-100 text-red-700; }
    .badge-urgent    { @apply px-2 py-0.5 text-[10px] font-bold uppercase rounded bg-orange-100 text-orange-700; }
    .badge-upcoming  { @apply px-2 py-0.5 text-[10px] font-bold uppercase rounded bg-yellow-100 text-yellow-700; }
    .badge-scheduled { @apply px-2 py-0.5 text-[10px] font-bold uppercase rounded bg-green-100 text-green-700; }
    details > summary { list-style: none; cursor: pointer; }
    details > summary::-webkit-details-marker { display: none; }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="h-full bg-slate-50 font-sans">
  <div class="flex h-full">

    <!-- Sidebar -->
    <aside class="w-56 shrink-0 bg-navy-800 flex flex-col" style="background:#1a2744">
      <!-- Logo -->
      <div class="px-5 py-5 border-b border-white/10">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 bg-green-700 rounded-xl flex items-center justify-center shadow-lg shadow-green-700/30">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 6v6m7-6v6M2 12h19.6M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>
          </div>
          <div>
            <div class="text-sm font-bold text-white leading-tight">DRT <span class="text-orange-400">Maintain</span></div>
            <div class="text-[10px] text-slate-400 leading-tight">Predictive Fleet Ops</div>
          </div>
        </div>
      </div>

      <!-- Nav -->
      <nav class="flex-1 px-3 py-4 space-y-1">
        <a href="/" class="nav-link {% if active_page == 'dashboard' %}nav-active{% endif %}">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v5a1 1 0 01-1 1H5a1 1 0 01-1-1V5zm10 0a1 1 0 011-1h4a1 1 0 011 1v3a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zm10-3a1 1 0 011-1h4a1 1 0 011 1v7a1 1 0 01-1 1h-4a1 1 0 01-1-1v-7z"/></svg>
          Dashboard
        </a>
        <a href="/fleet" class="nav-link {% if active_page == 'fleet' %}nav-active{% endif %}">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 6v6m7-6v6M2 12h19.6M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>
          Bus Fleet
        </a>
        <a href="/forecast" class="nav-link {% if active_page == 'forecast' %}nav-active{% endif %}">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          PM Forecast
        </a>
        <a href="/parts" class="nav-link {% if active_page == 'parts' %}nav-active{% endif %}">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
          Parts Inventory
        </a>
        <a href="/live" class="nav-link {% if active_page == 'live' %}nav-active{% endif %}">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6.3 6.3a8 8 0 000 11.4M17.7 6.3a8 8 0 010 11.4M3.5 3.5a12 12 0 000 17M20.5 3.5a12 12 0 010 17"/></svg>
          Live Fleet
        </a>
        <a href="/logs" class="nav-link {% if active_page == 'logs' %}nav-active{% endif %}">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
          Service Logs
        </a>
      </nav>

      <!-- Footer -->
      <div class="px-4 py-3 border-t border-white/10">
        <div class="text-[10px] text-slate-500">FastAPI · HTMX · SQLite</div>
        <div class="text-[10px] text-slate-600 mt-0.5">Durham College Hackathon 2026</div>
      </div>
    </aside>

    <!-- Main content -->
    <main class="flex-1 overflow-y-auto">
      <div class="max-w-7xl mx-auto px-6 py-6">
        {% block content %}{% endblock %}
      </div>
    </main>

  </div>

  <!-- Modal container -->
  <div id="modal-container"></div>

  <script>
    // Close modal on backdrop click
    document.addEventListener('click', function(e) {
      const mc = document.getElementById('modal-container');
      if (e.target === mc.firstElementChild?.firstElementChild) {
        mc.innerHTML = '';
      }
    });
    // ESC to close modal
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        document.getElementById('modal-container').innerHTML = '';
      }
    });
  </script>
</body>
</html>
