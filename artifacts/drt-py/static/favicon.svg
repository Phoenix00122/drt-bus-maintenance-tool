<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Green background pill -->
  <rect width="32" height="32" rx="7" fill="#2E7D32"/>
  <!-- Bus body -->
  <rect x="3" y="7" width="26" height="15" rx="2.5" fill="white"/>
  <!-- Windows (green cutouts in white body) -->
  <rect x="5"  y="10" width="6" height="5" rx="1" fill="#2E7D32"/>
  <rect x="13" y="10" width="6" height="5" rx="1" fill="#2E7D32"/>
  <rect x="21" y="10" width="6" height="5" rx="1" fill="#2E7D32"/>
  <!-- Wheels (overlap bottom of body) -->
  <circle cx="9"  cy="23" r="4.5" fill="#1B5E20"/>
  <circle cx="9"  cy="23" r="2"   fill="white"/>
  <circle cx="23" cy="23" r="4.5" fill="#1B5E20"/>
  <circle cx="23" cy="23" r="2"   fill="white"/>
</svg>
