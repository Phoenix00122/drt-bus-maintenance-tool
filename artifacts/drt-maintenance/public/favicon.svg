<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Green background -->
  <rect width="32" height="32" rx="6" fill="#2E7D32"/>
  <!-- Bus body: tall white rectangle -->
  <rect x="5" y="6" width="22" height="16" rx="2" fill="white"/>
  <!-- Windows: dark strips across the top of body -->
  <rect x="7" y="8" width="5" height="5" rx="1" fill="#2E7D32"/>
  <rect x="14" y="8" width="5" height="5" rx="1" fill="#2E7D32"/>
  <rect x="21" y="8" width="4" height="5" rx="1" fill="#2E7D32"/>
  <!-- Wheel left -->
  <circle cx="10" cy="24" r="4" fill="white"/>
  <circle cx="10" cy="24" r="2" fill="#2E7D32"/>
  <!-- Wheel right -->
  <circle cx="22" cy="24" r="4" fill="white"/>
  <circle cx="22" cy="24" r="2" fill="#2E7D32"/>
</svg>
